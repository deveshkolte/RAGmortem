[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragmortem"
version = "0.2.0"
description = "A local failure debugger for RAG applications: isolates retrieval, ranking, generation, and abstention failures."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Devesh Kolte" }
]
keywords = [
    "rag",
    "debugging",
    "llm",
    "retrieval",
    "observability",
    "failure-analysis",
    "cli",
    "rich",
    "evals"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/deveshkolte/RAGmortem"
Documentation = "https://github.com/deveshkolte/RAGmortem#readme"
Repository = "https://github.com/deveshkolte/RAGmortem"
Issues = "https://github.com/deveshkolte/RAGmortem/issues"

[project.scripts]
ragmortem = "ragmortem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
